[Rainmeter]
; Also sets equalizer speed: bars move 1px per update
Update=50
AccurateText=1
DynamicWindowSize=1

[Variables]
PluginName=MediaPlayer.dll

; LCD text color
LCDText=24,55,55,255

; Main LCD font
MainFont=Long Pixel-7


; ==================================================
; MEDIA
; ==================================================

[mTitle]
Measure=Plugin
Plugin=#PluginName#
PlayerType=Title
Substitute="":"No player active"
UpdateDivider=10

[mPosition]
Measure=Plugin
Plugin=#PluginName#
PlayerType=Position
UpdateDivider=4

[mState]
Measure=Plugin
Plugin=#PluginName#
PlayerType=State
UpdateDivider=4


; ==================================================
; ELAPSED TIME CLOCK
; The plugin's position can drift by ±1s every time Spotify
; reports its timeline, so the display skips or stalls.
; Instead, count with the system clock and only resync to the
; plugin when paused, or after a seek / track change (3s+ off).
; ==================================================

[mNow]
Measure=Time

[mOffset]
Measure=Calc
Formula=(((mState <> 1) || (Abs(mNow + mOffset - mPosition) >= 3)) ? (mPosition - mNow) : mOffset)

[mElapsedSec]
Measure=Calc
Formula=Max(Floor(mNow + mOffset), 0)

[mElapsed]
Measure=Uptime
SecondsValue=[mElapsedSec:]
Format="%2!02i!:%1!02i!"
DynamicVariables=1


; ==================================================
; EQUALIZER HEIGHTS
; Target: new random height every 0.3-0.5s while playing, full height otherwise
;         (different interval per bar so they don't all change at once)
; Bar: moves 1px toward its target on every update
; ==================================================

[mEQ1Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=6

[mEQ2Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=9

[mEQ3Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=7

[mEQ4Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=10

[mEQ5Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=8

[mEQ1]
Measure=Calc
Formula=mEQ1 + Clamp(mEQ1Target - mEQ1, -1, 1)

[mEQ2]
Measure=Calc
Formula=mEQ2 + Clamp(mEQ2Target - mEQ2, -1, 1)

[mEQ3]
Measure=Calc
Formula=mEQ3 + Clamp(mEQ3Target - mEQ3, -1, 1)

[mEQ4]
Measure=Calc
Formula=mEQ4 + Clamp(mEQ4Target - mEQ4, -1, 1)

[mEQ5]
Measure=Calc
Formula=mEQ5 + Clamp(mEQ5Target - mEQ5, -1, 1)


; ==================================================
; DEVICE BODY
; ==================================================

[PlayerBody]
Meter=Image
ImageName=#@#Images\player_body.png
X=0
Y=0
W=300
H=100
PreserveAspectRatio=1


; ==================================================
; TITLE
; Drawn twice, 1px apart, for a bolder look
; ==================================================

[Title]
Meter=String
MeasureName=mTitle
X=69
Y=33
W=150
H=26
FontFace=#MainFont#
FontSize=8.7
FontColor=#LCDText#
AntiAlias=0
ClipString=1

[TitleThickness]
Meter=String
MeasureName=mTitle
X=70
Y=33
W=149
H=26
FontFace=#MainFont#
FontSize=8.7
FontColor=#LCDText#
AntiAlias=0
ClipString=1


; ==================================================
; BATTERY ICON
; ==================================================

[BatteryOutline]
Meter=Shape
Shape=Rectangle 214,35,12,7,1 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #LCDText#

[BatteryTip]
Meter=Shape
Shape=Rectangle 226,37,2,3 | Fill Color #LCDText# | StrokeWidth 0

[Battery1]
Meter=Shape
Shape=Rectangle 216,37,2,3 | Fill Color #LCDText# | StrokeWidth 0

[Battery2]
Meter=Shape
Shape=Rectangle 219,37,2,3 | Fill Color #LCDText# | StrokeWidth 0

[Battery3]
Meter=Shape
Shape=Rectangle 222,37,2,3 | Fill Color #LCDText# | StrokeWidth 0


; ==================================================
; PLAY SYMBOL
; Small triangle instead of the ">" character
; ==================================================

[PlaySymbol]
Meter=Shape
Shape=Path PlayTriangle | Fill Color #LCDText# | StrokeWidth 0
PlayTriangle=72,54 | LineTo 72,60 | LineTo 77,57 | ClosePath 1


; ==================================================
; ELAPSED TIME
; ==================================================

[Position]
Meter=String
MeasureName=mElapsed
X=80
Y=51
FontFace=#MainFont#
FontSize=5
FontColor=#LCDText#
AntiAlias=0
InlineSetting=CharacterSpacing | 0.6 | 0.6


; ==================================================
; EQUALIZER
; Bars grow upward from y=62
; ==================================================

[EQ1]
Meter=Shape
Shape=Rectangle 209,(62-[mEQ1]),2,[mEQ1],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ2]
Meter=Shape
Shape=Rectangle 213,(62-[mEQ2]),2,[mEQ2],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ3]
Meter=Shape
Shape=Rectangle 217,(62-[mEQ3]),2,[mEQ3],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ4]
Meter=Shape
Shape=Rectangle 221,(62-[mEQ4]),2,[mEQ4],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ5]
Meter=Shape
Shape=Rectangle 225,(62-[mEQ5]),2,[mEQ5],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1


; ==================================================
; INVISIBLE CONTROLS
; ==================================================

[PreviousButton]
Meter=Shape
Shape=Rectangle 15,30,18,35 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure "mState" "Previous"]

[PlayPauseButton]
Meter=Shape
Shape=Rectangle 35,30,20,35 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure "mState" "PlayPause"]

[NextButton]
Meter=Shape
Shape=Rectangle 57,30,18,35 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure "mState" "Next"]
