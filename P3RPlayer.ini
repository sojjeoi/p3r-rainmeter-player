[Rainmeter]
; Also sets equalizer speed: bars move 1px per update
Update=50
AccurateText=1
DynamicWindowSize=1

; Right-click menu: LCD color presets (screen color + matching text color).
; The choice is written into [Variables] below, so it is kept after restart.
ContextTitle=LCD: Teal (default)
ContextAction=[!WriteKeyValue Variables LCDColor "150,225,227"][!WriteKeyValue Variables LCDText "24,55,55,255"][!Refresh]
ContextTitle2=LCD: Yellow
ContextAction2=[!WriteKeyValue Variables LCDColor "255,232,40"][!WriteKeyValue Variables LCDText "35,28,0,255"][!Refresh]
ContextTitle3=LCD: Red
ContextAction3=[!WriteKeyValue Variables LCDColor "255,110,100"][!WriteKeyValue Variables LCDText "40,0,5,255"][!Refresh]
ContextTitle4=LCD: Green
ContextAction4=[!WriteKeyValue Variables LCDColor "175,220,130"][!WriteKeyValue Variables LCDText "18,38,8,255"][!Refresh]
ContextTitle5=LCD: Amber
ContextAction5=[!WriteKeyValue Variables LCDColor "255,190,80"][!WriteKeyValue Variables LCDText "45,20,0,255"][!Refresh]
ContextTitle6=LCD: Blue
ContextAction6=[!WriteKeyValue Variables LCDColor "130,190,255"][!WriteKeyValue Variables LCDText "5,18,48,255"][!Refresh]
ContextTitle7=LCD: Pink
ContextAction7=[!WriteKeyValue Variables LCDColor "255,175,205"][!WriteKeyValue Variables LCDText "45,8,25,255"][!Refresh]
ContextTitle8=LCD: White
ContextAction8=[!WriteKeyValue Variables LCDColor "235,240,240"][!WriteKeyValue Variables LCDText "30,30,30,255"][!Refresh]

[Variables]
PluginName=MediaPlayer.dll

; LCD screen color (tints @Resources\Images\lcd_screen.png).
; Shows about 14% darker than the value, since the screen texture is not pure white.
LCDColor=150,225,227

; LCD text color
LCDText=24,55,55,255

; Main LCD font
MainFont=Long Pixel-7

; Top rim buttons: shift all of them left/right (X) or up/down (Y)
RimBtnX=0
RimBtnY=22

; Rim button metal gradient: normal, and brighter while the mouse is over it
RimMetalNormal=90 | 175,175,175,255 ; 0.0 | 95,95,95,255 ; 0.4 | 55,55,55,255 ; 1.0
RimMetalHover=90 | 240,240,240,255 ; 0.0 | 150,150,150,255 ; 0.4 | 80,80,80,255 ; 1.0

; Volume step for the VOL -/+ buttons (percent)
VolStep=5

; LCD shows the track title (0) or the artist (1); toggled by DISP
ShowArtist=0

; Which rim button currently owns the hover label (see mTipCheck)
TipOwner=none
TipLeaving=none


; ==================================================
; MEDIA
; ==================================================
; Each plugin call blocks Rainmeter until Windows answers, and browsers can
; answer slowly, so poll sparingly: ~5 calls/s in total (was ~14 and could
; freeze Rainmeter with YouTube). The elapsed clock runs on its own anyway.

[mTitle]
Measure=Plugin
Plugin=#PluginName#
PlayerType=Title
Substitute="":"No player active"
UpdateDivider=20

[mPosition]
Measure=Plugin
Plugin=#PluginName#
PlayerType=Position
UpdateDivider=20

[mState]
Measure=Plugin
Plugin=#PluginName#
PlayerType=State
UpdateDivider=10

[mArtist]
Measure=Plugin
Plugin=#PluginName#
PlayerType=Artist
UpdateDivider=21

; Windows master volume, for the VOL -/+ buttons
[mVolume]
Measure=Plugin
Plugin=Win7AudioPlugin

; Switches the LCD text between title and artist when DISP is pressed
[mShowArtist]
Measure=Calc
Formula=#ShowArtist#
DynamicVariables=1
IfCondition=mShowArtist = 1
IfTrueAction=[!SetOption Title MeasureName mArtist][!SetOption TitleThickness MeasureName mArtist]
IfFalseAction=[!SetOption Title MeasureName mTitle][!SetOption TitleThickness MeasureName mTitle]


; ==================================================
; ELAPSED TIME CLOCK
; The plugin's position can drift by ±1s every time Spotify
; reports its timeline, so the display skips or stalls.
; Instead, count with the system clock and only resync to the
; plugin when paused, or after a seek / track change (3s+ off).
; ==================================================

[mNow]
Measure=Time

[mOffset]
Measure=Calc
Formula=(((mState <> 1) || (Abs(mNow + mOffset - mPosition) >= 3)) ? (mPosition - mNow) : mOffset)

[mElapsedSec]
Measure=Calc
Formula=Max(Floor(mNow + mOffset), 0)

[mElapsed]
Measure=Uptime
SecondsValue=[mElapsedSec:]
Format="%2!02i!:%1!02i!"
DynamicVariables=1


; ==================================================
; EQUALIZER HEIGHTS
; Target: new random height every 0.3-0.5s while playing, full height otherwise
;         (different interval per bar so they don't all change at once)
; Bar: moves 1px toward its target on every update
; ==================================================

[mEQ1Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=6

[mEQ2Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=9

[mEQ3Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=7

[mEQ4Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=10

[mEQ5Target]
Measure=Calc
Formula=((mState = 1) ? Random : 10)
LowBound=4
HighBound=10
UpdateRandom=1
UpdateDivider=8

[mEQ1]
Measure=Calc
Formula=mEQ1 + Clamp(mEQ1Target - mEQ1, -1, 1)

[mEQ2]
Measure=Calc
Formula=mEQ2 + Clamp(mEQ2Target - mEQ2, -1, 1)

[mEQ3]
Measure=Calc
Formula=mEQ3 + Clamp(mEQ3Target - mEQ3, -1, 1)

[mEQ4]
Measure=Calc
Formula=mEQ4 + Clamp(mEQ4Target - mEQ4, -1, 1)

[mEQ5]
Measure=Calc
Formula=mEQ5 + Clamp(mEQ5Target - mEQ5, -1, 1)


; ==================================================
; RIM BUTTONS (visual)
; Row of metal buttons on the top rim, modeled on the Sony NW-S20x
; Walkman the in-game player is based on. Left to right:
;   DISP (title/artist) | PLAY/PAUSE | VOL- / VOL+ (rocker, two halves) | PREV | NEXT
; Drawn before the body so the rim hides their lower half.
; Clicks are caught by the RIM BUTTON HIT AREAS further down, which sit on
; top of the body; they highlight and press these bars by name.
; ==================================================

[RimDisp]
Meter=Shape
X=(#RimBtnX#+71)
Y=(#RimBtnY#-3)
Shape=Rectangle 1,3,10,3,1.5 | Fill LinearGradient RimMetal | StrokeWidth 1 | Stroke Color 25,25,25,255
RimMetal=#RimMetalNormal#

[RimPlay]
Meter=Shape
X=(#RimBtnX#+92)
Y=(#RimBtnY#-3)
Shape=Rectangle 1,3,10,3,1.5 | Fill LinearGradient RimMetal | StrokeWidth 1 | Stroke Color 25,25,25,255
RimMetal=#RimMetalNormal#

; Volume rocker: two halves that touch, so the joint reads as a groove
[RimVolDown]
Meter=Shape
X=(#RimBtnX#+112)
Y=(#RimBtnY#-3)
Shape=Rectangle 1,3,20,3,1.5 | Fill LinearGradient RimMetal | StrokeWidth 1 | Stroke Color 25,25,25,255
RimMetal=#RimMetalNormal#

[RimVolUp]
Meter=Shape
X=(#RimBtnX#+133)
Y=(#RimBtnY#-3)
Shape=Rectangle 0,3,18,3,1.5 | Fill LinearGradient RimMetal | StrokeWidth 1 | Stroke Color 25,25,25,255
RimMetal=#RimMetalNormal#

[RimPrev]
Meter=Shape
X=(#RimBtnX#+160)
Y=(#RimBtnY#-3)
Shape=Rectangle 1,3,19,3,1.5 | Fill LinearGradient RimMetal | StrokeWidth 1 | Stroke Color 25,25,25,255
RimMetal=#RimMetalNormal#

[RimNext]
Meter=Shape
X=(#RimBtnX#+190)
Y=(#RimBtnY#-3)
Shape=Rectangle 1,3,19,3,1.5 | Fill LinearGradient RimMetal | StrokeWidth 1 | Stroke Color 25,25,25,255
RimMetal=#RimMetalNormal#

; ==================================================
; DEVICE BODY
; ==================================================

[PlayerBody]
Meter=Image
; Pre-scaled from player_body.png (Lanczos + light sharpening) for crisper metal
ImageName=#@#Images\player_body_300.png
X=0
Y=0
W=300
H=100
PreserveAspectRatio=1

; LCD screen, drawn separately so its color can be changed (LCDColor)
[LCDScreen]
Meter=Image
ImageName=#@#Images\lcd_screen.png
X=0
Y=0
W=300
H=100
ImageTint=#LCDColor#


; ==================================================
; TITLE
; Drawn twice, 1px apart, for a bolder look
; ==================================================

[Title]
Meter=String
MeasureName=mTitle
X=69
Y=33
W=150
H=26
FontFace=#MainFont#
FontSize=8.7
FontColor=#LCDText#
AntiAlias=0
ClipString=1

[TitleThickness]
Meter=String
MeasureName=mTitle
X=70
Y=33
W=149
H=26
FontFace=#MainFont#
FontSize=8.7
FontColor=#LCDText#
AntiAlias=0
ClipString=1


; ==================================================
; BATTERY ICON
; ==================================================

[BatteryOutline]
Meter=Shape
Shape=Rectangle 214,35,12,7,1 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #LCDText#

[BatteryTip]
Meter=Shape
Shape=Rectangle 226,37,2,3 | Fill Color #LCDText# | StrokeWidth 0

[Battery1]
Meter=Shape
Shape=Rectangle 216,37,2,3 | Fill Color #LCDText# | StrokeWidth 0

[Battery2]
Meter=Shape
Shape=Rectangle 219,37,2,3 | Fill Color #LCDText# | StrokeWidth 0

[Battery3]
Meter=Shape
Shape=Rectangle 222,37,2,3 | Fill Color #LCDText# | StrokeWidth 0


; ==================================================
; PLAY SYMBOL
; Small triangle instead of the ">" character
; ==================================================

[PlaySymbol]
Meter=Shape
Shape=Path PlayTriangle | Fill Color #LCDText# | StrokeWidth 0
PlayTriangle=72,52 | LineTo 72,60 | LineTo 78,56 | ClosePath 1


; ==================================================
; ELAPSED TIME
; ==================================================

[Position]
Meter=String
MeasureName=mElapsed
X=80
Y=51
FontFace=#MainFont#
FontSize=5
FontColor=#LCDText#
AntiAlias=0
InlineSetting=CharacterSpacing | 0.6 | 0.6


; ==================================================
; EQUALIZER
; Bars grow upward from y=62
; ==================================================

[EQ1]
Meter=Shape
Shape=Rectangle 209,(62-[mEQ1]),2,[mEQ1],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ2]
Meter=Shape
Shape=Rectangle 213,(62-[mEQ2]),2,[mEQ2],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ3]
Meter=Shape
Shape=Rectangle 217,(62-[mEQ3]),2,[mEQ3],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ4]
Meter=Shape
Shape=Rectangle 221,(62-[mEQ4]),2,[mEQ4],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1

[EQ5]
Meter=Shape
Shape=Rectangle 225,(62-[mEQ5]),2,[mEQ5],0 | Fill Color #LCDText# | StrokeWidth 0
DynamicVariables=1


; ==================================================
; INVISIBLE CONTROLS
; ==================================================

[PreviousButton]
Meter=Shape
Shape=Rectangle 15,30,18,35 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure "mState" "Previous"]

[PlayPauseButton]
Meter=Shape
Shape=Rectangle 35,30,20,35 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure "mState" "PlayPause"]

[NextButton]
Meter=Shape
Shape=Rectangle 57,30,18,35 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure "mState" "Next"]


; Hides the hover label only if the button being left still owns it.
; Moving between neighbors can fire the new button's MouseOver before the old
; one's MouseLeave; without this check the old button would hide the new label.
[mTipCheck]
Measure=String
String=#TipOwner#|#TipLeaving#
DynamicVariables=1
UpdateDivider=-1
IfMatch=^(.+)\|\1$
IfMatchAction=[!HideMeter RimTip][!Redraw]
IfMatchMode=1
; ==================================================
; RIM BUTTON HIT AREAS
; Invisible click areas on top of the body (a near-transparent area behind
; the body barely registers the mouse). Each covers its button plus half the
; gap to the next one, from 6px above the rim to 6px into it.
; ==================================================
[HitDisp]
Meter=Shape
X=(#RimBtnX#+67)
Y=(#RimBtnY#-6)
Shape=Rectangle 0,0,21,12 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetVariable TipOwner "HitDisp"][!SetOption RimDisp RimMetal "#RimMetalHover#"][!UpdateMeter RimDisp][!SetOption RimTip Text "INFO"][!SetOption RimTip X (#RimBtnX#+77)][!ShowMeter RimTip][!UpdateMeter RimTip][!Redraw]
MouseLeaveAction=[!SetOption RimDisp RimMetal "#RimMetalNormal#"][!UpdateMeter RimDisp][!SetVariable TipLeaving "HitDisp"][!UpdateMeasure mTipCheck][!Redraw]
LeftMouseDownAction=[!SetOption RimDisp Y (#RimBtnY#-2)][!UpdateMeter RimDisp][!Redraw]
LeftMouseUpAction=[!SetOption RimDisp Y (#RimBtnY#-3)][!UpdateMeter RimDisp][!Redraw][!SetVariable ShowArtist (1-[mShowArtist])][!UpdateMeasure mShowArtist]

[HitPlay]
Meter=Shape
X=(#RimBtnX#+88)
Y=(#RimBtnY#-6)
Shape=Rectangle 0,0,20,12 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetVariable TipOwner "HitPlay"][!SetOption RimPlay RimMetal "#RimMetalHover#"][!UpdateMeter RimPlay][!SetOption RimTip Text "PLAY"][!SetOption RimTip X (#RimBtnX#+98)][!ShowMeter RimTip][!UpdateMeter RimTip][!Redraw]
MouseLeaveAction=[!SetOption RimPlay RimMetal "#RimMetalNormal#"][!UpdateMeter RimPlay][!SetVariable TipLeaving "HitPlay"][!UpdateMeasure mTipCheck][!Redraw]
LeftMouseDownAction=[!SetOption RimPlay Y (#RimBtnY#-2)][!UpdateMeter RimPlay][!Redraw]
LeftMouseUpAction=[!SetOption RimPlay Y (#RimBtnY#-3)][!UpdateMeter RimPlay][!Redraw][!CommandMeasure "mState" "PlayPause"]

[HitVolDown]
Meter=Shape
X=(#RimBtnX#+108)
Y=(#RimBtnY#-6)
Shape=Rectangle 0,0,25,12 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetVariable TipOwner "HitVolDown"][!SetOption RimVolDown RimMetal "#RimMetalHover#"][!UpdateMeter RimVolDown][!SetOption RimTip Text "VOL -"][!SetOption RimTip X (#RimBtnX#+122)][!ShowMeter RimTip][!UpdateMeter RimTip][!Redraw]
MouseLeaveAction=[!SetOption RimVolDown RimMetal "#RimMetalNormal#"][!UpdateMeter RimVolDown][!SetVariable TipLeaving "HitVolDown"][!UpdateMeasure mTipCheck][!Redraw]
LeftMouseDownAction=[!SetOption RimVolDown Y (#RimBtnY#-2)][!UpdateMeter RimVolDown][!Redraw]
LeftMouseUpAction=[!SetOption RimVolDown Y (#RimBtnY#-3)][!UpdateMeter RimVolDown][!Redraw][!CommandMeasure "mVolume" "ChangeVolume -#VolStep#"]

[HitVolUp]
Meter=Shape
X=(#RimBtnX#+133)
Y=(#RimBtnY#-6)
Shape=Rectangle 0,0,23,12 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetVariable TipOwner "HitVolUp"][!SetOption RimVolUp RimMetal "#RimMetalHover#"][!UpdateMeter RimVolUp][!SetOption RimTip Text "VOL +"][!SetOption RimTip X (#RimBtnX#+142)][!ShowMeter RimTip][!UpdateMeter RimTip][!Redraw]
MouseLeaveAction=[!SetOption RimVolUp RimMetal "#RimMetalNormal#"][!UpdateMeter RimVolUp][!SetVariable TipLeaving "HitVolUp"][!UpdateMeasure mTipCheck][!Redraw]
LeftMouseDownAction=[!SetOption RimVolUp Y (#RimBtnY#-2)][!UpdateMeter RimVolUp][!Redraw]
LeftMouseUpAction=[!SetOption RimVolUp Y (#RimBtnY#-3)][!UpdateMeter RimVolUp][!Redraw][!CommandMeasure "mVolume" "ChangeVolume #VolStep#"]

[HitPrev]
Meter=Shape
X=(#RimBtnX#+156)
Y=(#RimBtnY#-6)
Shape=Rectangle 0,0,29,12 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetVariable TipOwner "HitPrev"][!SetOption RimPrev RimMetal "#RimMetalHover#"][!UpdateMeter RimPrev][!SetOption RimTip Text "PREV"][!SetOption RimTip X (#RimBtnX#+170)][!ShowMeter RimTip][!UpdateMeter RimTip][!Redraw]
MouseLeaveAction=[!SetOption RimPrev RimMetal "#RimMetalNormal#"][!UpdateMeter RimPrev][!SetVariable TipLeaving "HitPrev"][!UpdateMeasure mTipCheck][!Redraw]
LeftMouseDownAction=[!SetOption RimPrev Y (#RimBtnY#-2)][!UpdateMeter RimPrev][!Redraw]
LeftMouseUpAction=[!SetOption RimPrev Y (#RimBtnY#-3)][!UpdateMeter RimPrev][!Redraw][!CommandMeasure "mState" "Previous"]

[HitNext]
Meter=Shape
X=(#RimBtnX#+185)
Y=(#RimBtnY#-6)
Shape=Rectangle 0,0,29,12 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetVariable TipOwner "HitNext"][!SetOption RimNext RimMetal "#RimMetalHover#"][!UpdateMeter RimNext][!SetOption RimTip Text "NEXT"][!SetOption RimTip X (#RimBtnX#+200)][!ShowMeter RimTip][!UpdateMeter RimTip][!Redraw]
MouseLeaveAction=[!SetOption RimNext RimMetal "#RimMetalNormal#"][!UpdateMeter RimNext][!SetVariable TipLeaving "HitNext"][!UpdateMeasure mTipCheck][!Redraw]
LeftMouseDownAction=[!SetOption RimNext Y (#RimBtnY#-2)][!UpdateMeter RimNext][!Redraw]
LeftMouseUpAction=[!SetOption RimNext Y (#RimBtnY#-3)][!UpdateMeter RimNext][!Redraw][!CommandMeasure "mState" "Next"]

; ==================================================
; RIM BUTTON LABEL
; Small LCD-style label shown just above whichever rim button the mouse is over.
; Each rim button sets its Text and X on hover and hides it on leave.
; Drawn last so it sits on top of everything.
; ==================================================

[RimTip]
Meter=String
X=0
Y=(#RimBtnY#-7)
StringAlign=CenterBottom
Text=
FontFace=#MainFont#
FontSize=6
FontColor=#LCDText#
SolidColor=#LCDColor#
Padding=3,1,3,1
AntiAlias=0
Hidden=1
